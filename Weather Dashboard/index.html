<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="weather-container">

        <h1>🌤️ Weather Dashboard</h1>

        <p class="subtitle">Check real-time weather information</p>

        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name">
            <button id="searchBtn">Search</button>
        </div>

        <p id="message"></p>

        <div id="weatherResult" class="weather-result">

            <h2 id="cityName">City Name</h2>

            <div class="temperature">
                <span id="temperature">--</span>°C
            </div>

            <p id="weatherDescription">Weather information will appear here</p>

            <div class="weather-details">

                <div class="weather-card">
                    <span>💧</span>
                    <h3>Humidity</h3>
                    <p id="humidity">--%</p>
                </div>

                <div class="weather-card">
                    <span>💨</span>
                    <h3>Wind Speed</h3>
                    <p id="windSpeed">-- km/h</p>
                </div>

                <div class="weather-card">
                    <span>🌡️</span>
                    <h3>Temperature</h3>
                    <p id="temperatureCard">--°C</p>
                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
