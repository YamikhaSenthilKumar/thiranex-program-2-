<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Your Name</title>
    <meta name="description" content="Contact Your Name about web development and website projects.">
    <meta name="author" content="Your Name">
    <meta name="robots" content="index, follow">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<a class="skip-link" href="#main-content">Skip to main content</a>

<header class="site-header">
    <div class="container">
        <a class="logo" href="index.html" aria-label="Your Name home">
            Your Name
        </a>

        <nav aria-label="Primary navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>
    </div>
</header>

<main id="main-content">

    <section class="container page-content" aria-labelledby="contact-title">

        <header>
            <p class="eyebrow">Get In Touch</p>
            <h1 id="contact-title">Contact Me</h1>

            <p>
                Fill out the form below to send me a message.
            </p>
        </header>

        <form class="contact-form" action="#" method="post">

            <div class="form-group">
                <label for="name">
                    Name <span aria-hidden="true">*</span>
                </label>

                <input
                    id="name"
                    name="name"
                    type="text"
                    autocomplete="name"
                    required
                    aria-required="true">
            </div>

            <div class="form-group">
                <label for="email">
                    Email <span aria-hidden="true">*</span>
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    inputmode="email"
                    required
                    aria-required="true">
            </div>

            <div class="form-group">
                <label for="subject">
                    Subject
                </label>

                <input
                    id="subject"
                    name="subject"
                    type="text"
                    autocomplete="off">
            </div>

            <div class="form-group">
                <label for="message">
                    Message <span aria-hidden="true">*</span>
                </label>

                <textarea
                    id="message"
                    name="message"
                    rows="8"
                    required
                    aria-required="true"></textarea>
            </div>

            <p class="required-note">
                <span aria-hidden="true">*</span> Required field
            </p>

            <button type="submit">
                Send Message
            </button>

        </form>

    </section>

</main>

<footer class="site-footer">
    <div class="container">
        <p>&copy; 2026 Your Name. All rights reserved.</p>
    </div>
</footer>

</body>
</html>
